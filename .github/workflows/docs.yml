name: Documentation, native domain and design reference

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Latest stable action releases resolved 2026-10-27; immutable pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Verify documentation and public artifacts
        run: python tools/check_docs.py
      - name: Verify current native domain boundaries
        run: python tools/check_architecture.py
      - name: Verify synthetic phone-runner safety boundaries
        run: python -m unittest discover -s tools/tests -p "test_collection_probe.py"
      - name: Verify whitespace
        run: git show --format= --check HEAD

  native-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Compile and verify synthetic Kotlin analytics
        run: python tools/test_analytics.py
      - name: Compile and verify synthetic collection reconciliation
        run: python tools/test_reconciliation.py --offline

  mobile-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0
          run_install: false
      - name: Install reviewed locked mobile graph
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit installed pins and patch evidence
        run: python tools/check_mobile.py --installed
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run format:check
      - run: pnpm test
      - name: Bundle actual Android entry point
        run: pnpm run bundle:android

  design-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: design/prototype
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Latest stable releases resolved 2026-10-27, immutable commit pins.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'node'
          check-latest: true
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0
          package_json_file: design/prototype/package.json
          run_install: false
      - name: Install locked design tools
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install browser system dependencies
        run: pnpm exec playwright install-deps chromium
      - name: Install isolated Chromium
        run: pnpm run browser:install
      - name: Verify interactions, accessibility and contrast
        run: pnpm test
