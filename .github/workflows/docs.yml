name: Documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Latest stable action releases resolved 2026-10-27; immutable pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Verify documentation and public artifacts
        run: python tools/check_docs.py
      - name: Verify whitespace
        run: git show --format= --check HEAD
