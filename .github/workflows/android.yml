name: Android native qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0
          run_install: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install reviewed locked mobile graph
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit installed graph
        run: python tools/check_mobile.py --installed
      - name: Install exact native SDK components on the disposable runner
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          'platforms;android-37.0' 'build-tools;37.0.0'
          'ndk;30.0.16248370' 'cmake;4.1.2'
      - name: Compile ARM64 debug, unsigned release and synthetic test APK
        run: >-
          python tools/android_build.py --sdk "$ANDROID_HOME" --arch arm64-v8a
          :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :analytics-core:verifyAnalytics :collection-prototype:verifyReconciliation :app:lintDebug
      - name: Verify resolved native backport artifact
        run: python tools/check_mobile.py --native-cache
      # No signing secrets, device access or binary upload. Compilation is not runtime acceptance.
